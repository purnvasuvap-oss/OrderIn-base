<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metalIdle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4048"/>
      <stop offset="100%" stop-color="#1c2128"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-12 48 48)">
    <ellipse cx="48" cy="82" rx="24" ry="4" fill="#000" opacity="0.3"/>
    <!-- slate body -->
    <rect x="18" y="40" width="60" height="38" rx="4" fill="url(#metalIdle)" stroke="#0c0f13" stroke-width="1.5"/>
    <!-- clapper stripes bar -->
    <g transform="rotate(-8 48 34)">
      <rect x="16" y="24" width="64" height="14" rx="3" fill="#111418"/>
      <g>
        <rect x="16" y="24" width="8" height="14" fill="#e9e2cf"/>
        <rect x="24" y="24" width="8" height="14" fill="#111418"/>
        <rect x="32" y="24" width="8" height="14" fill="#e9e2cf"/>
        <rect x="40" y="24" width="8" height="14" fill="#111418"/>
        <rect x="48" y="24" width="8" height="14" fill="#e9e2cf"/>
        <rect x="56" y="24" width="8" height="14" fill="#111418"/>
        <rect x="64" y="24" width="8" height="14" fill="#e9e2cf"/>
        <rect x="72" y="24" width="8" height="14" fill="#111418"/>
      </g>
    </g>
    <!-- hinge -->
    <circle cx="18" cy="32" r="4" fill="#55565a"/>
    <!-- lines on slate -->
    <rect x="24" y="50" width="34" height="3" fill="#5a626e"/>
    <rect x="24" y="58" width="26" height="3" fill="#5a626e"/>
    <rect x="24" y="66" width="30" height="3" fill="#5a626e"/>
  </g>
</svg>
