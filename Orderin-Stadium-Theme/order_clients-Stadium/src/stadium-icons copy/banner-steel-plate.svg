<svg width="100%" height="64" viewBox="0 0 600 64" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="steelBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a8f98"/>
      <stop offset="12%" stop-color="#5a626e"/>
      <stop offset="50%" stop-color="#40464f"/>
      <stop offset="88%" stop-color="#2a3038"/>
      <stop offset="100%" stop-color="#1c2128"/>
    </linearGradient>
    <linearGradient id="steelSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rivet" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e4e6e9"/>
      <stop offset="45%" stop-color="#8a8f98"/>
      <stop offset="100%" stop-color="#20242a"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="600" height="64" rx="10" fill="url(#steelBody)"/>
  <rect x="0" y="0" width="600" height="64" rx="10" fill="url(#steelSheen)"/>
  <rect x="1" y="1" width="598" height="62" rx="9" fill="none" stroke="#0c0f13" stroke-width="2"/>
  <rect x="2" y="2" width="596" height="1.5" fill="#ffffff" opacity="0.18"/>

  <!-- rust/wear freckles -->
  <circle cx="480" cy="46" r="1.4" fill="#5a3a1e" opacity="0.35"/>
  <circle cx="495" cy="40" r="0.9" fill="#5a3a1e" opacity="0.3"/>
  <circle cx="120" cy="18" r="1" fill="#5a3a1e" opacity="0.25"/>

  <!-- rivets row: top + bottom, repeated along the plate -->
  <g id="rivets-top">
    <circle cx="18" cy="10" r="4" fill="url(#rivet)"/>
    <circle cx="88" cy="10" r="4" fill="url(#rivet)"/>
    <circle cx="158" cy="10" r="4" fill="url(#rivet)"/>
    <circle cx="228" cy="10" r="4" fill="url(#rivet)"/>
    <circle cx="298" cy="10" r="4" fill="url(#rivet)"/>
    <circle cx="368" cy="10" r="4" fill="url(#rivet)"/>
    <circle cx="438" cy="10" r="4" fill="url(#rivet)"/>
    <circle cx="508" cy="10" r="4" fill="url(#rivet)"/>
    <circle cx="582" cy="10" r="4" fill="url(#rivet)"/>
  </g>
  <g id="rivets-bottom">
    <circle cx="18" cy="54" r="4" fill="url(#rivet)"/>
    <circle cx="88" cy="54" r="4" fill="url(#rivet)"/>
    <circle cx="158" cy="54" r="4" fill="url(#rivet)"/>
    <circle cx="228" cy="54" r="4" fill="url(#rivet)"/>
    <circle cx="298" cy="54" r="4" fill="url(#rivet)"/>
    <circle cx="368" cy="54" r="4" fill="url(#rivet)"/>
    <circle cx="438" cy="54" r="4" fill="url(#rivet)"/>
    <circle cx="508" cy="54" r="4" fill="url(#rivet)"/>
    <circle cx="582" cy="54" r="4" fill="url(#rivet)"/>
  </g>
</svg>
